# =============================================================================
# EfS proto 02 — ld65 config: ONE 8 KB bank, Model B
# =============================================================================
# The cartridge window is $8000-$9FFF. This bench needs no banking, so the image
# is exactly one bank — the smallest cartridge the hardware (and madsim's
# "multiple of 8 KiB" check) accepts. The real game is planned at 256 KB.
#
# Model B: CODE and RODATA are STORED in the window and RUN from RAM at $2000,
# because a read in the cartridge window costs 3 wait states and an instruction
# fetch is a read. bootstrap.s does the copy; define=yes is what gives it the
# __CODE_LOAD__ / __CODE_RUN__ / __RODATA_* symbols to do it with.
#
# $2000 is chosen to clear the tables the game puts at $0400-$09FF and to leave
# the whole of $0A00-$1FFF free for whatever the next prototype needs.
#
# fillval=$FF, not $EA: unprogrammed EPROM cells read as $FF, so an image padded
# with $FF matches what a real part looks like outside the used area.
# =============================================================================

MEMORY {
    ROM: start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    RAM: start=$2000, size=$4000, type=rw;
}

SEGMENTS {
    HEADER: load=ROM,           type=ro, start=$8000;  # signature + vectors
    BOOT:   load=ROM,           type=ro;               # runs in place, once
    CODE:   load=ROM, run=RAM,  type=ro, define=yes;   # copied to RAM
    RODATA: load=ROM, run=RAM,  type=ro, define=yes;   # ...and so is this
}
