# =============================================================================
# Escape from Saturn — ld65 config: FOUR 8 KB banks, Model B
# =============================================================================
# The cartridge window is $8000-$9FFF, so one bank is 8 KB and the image is a
# whole number of them. The part is 256 KB — 32 banks — so a bank costs nothing
# and the map has grown one at a time as segments outgrew the one they were in:
#
#   bank 0   HEADER + BOOT + CODE      - the flight engine
#   bank 1   CODE2                     - the subsystems
#   bank 2   RODATA                    - every table
#                                        (RODATA runs at $A000, since THE RODATA
#                                        MOVE below - not $2000. BGDATA is not
#                                        copied anywhere at all)
#   bank 3   HIDATA                    - runs at $A000, not $2000 - see below
#   bank 4   COLD + CODE4 + BGDATA     - COLD is never copied anywhere - see
#                                        below. CODE4 (laser.s) rides behind
#                                        it and IS copied, to the run area:
#                                        bank 3 was too full to take it
#                                        ...and CODE5 (cam.s, hiscore.s) behind
#                                        BGDATA, run in DEMO_RAM
#   bank 5   ART5                      - the intro's and title's pictures, RLE
#   bank 6   ART6 + UICODE             - the rest of them, and the screens' code
#                                        (screens.s), run in DEMO_RAM
#   bank 7   SPRART + CODE7            - sprite art and the base's wall
#   bank 8   LEVELS                    - every level's opening state, read in
#                                        the window once a sector
#   bank 9   MSGDATA                   - every message, and NOTHING else: the
#                                        bank is dedicated so the pointer model
#                                        stays flat - see THE MESSAGE BANK below
#   banks 10-11 MUSICBLOB              - the VGM stream, read in the window
#
# CODE2 arrived with radar.s: the radar took CODE past 8 KB the moment the HUD
# was switched on, and the answer is the same one physics.s got - another bank,
# which is free.
#
# BANK 2 arrived with the SPLIT: rock_split's code and the four tables
# physics.md section 6 asks for took CODE2 + RODATA past 8 KB together. RODATA
# is what moved, and not BGDATA, for one reason - `RING_BANK` is emitted by
# tools/bggen.py into src/radar_bg.s, so moving the ring means the generator and
# the generated file have to move with it. RODATA has no such tie.
#
# BANK 3 (HIDATA) arrived with screen shake: CODE+CODE2+RODATA together ran
# past the 16 KB $2000-$5FFF window has (design_technical.md 11.18's "that
# number, not the bank map, is what a new table has to fit in"). A bank is
# still free, but ANOTHER one chained into that same $2000-$5FFF run would not
# have helped - the window itself was the scarce resource, not ROM. HIDATA
# instead runs at $A000, MAD-65's separate "upper RAM" ($A000-$BEFF, ~7.75 KB,
# free regardless of CART_EN - MAD-65 docs/MAD65_CPU_OS.md), which nothing else
# in this cartridge had ever touched. Same cart_load pattern, a fourth call in
# bootstrap.s, its own 7.75 KB budget entirely separate from the other three.
#
# BANK 4 (COLD) IS THE ONE THAT IS NEVER COPIED. Every segment above pays RAM
# for itself - that is what `run=` means - and the $2000-$5FFF window is the
# scarce thing in this cartridge (it stood at 50 free bytes). COLD is the other
# answer: data that is READ STRAIGHT OUT OF THE WINDOW, like BGDATA, so it costs
# no RAM at all and only the cartridge's three wait states on the reads that
# actually happen.
#
# WHAT BELONGS HERE. Anything read OCCASIONALLY, or a few isolated bytes at a
# time, rather than walked every frame in a hot per-object loop. The first
# tenant is EXPL_OFF (shots.s), the mini explosion's 3,072-byte animation - the
# single biggest object in the whole image, 65% of RODATA, and read at most 96
# times a frame from ONE loop. 96 reads x 3 wait states is ~290 cycles, 0.12% of
# a frame, against 18.8% of the RAM window handed back. Level scripts, message
# text and GUI tables are the natural next tenants; asteroid outlines and the
# collision tables are NOT - those are per-object and per-frame, and would pay
# the wait states thousands of times over.
#
# THE PRICE IS THE BANK REGISTER. A window read only returns the right byte if
# the right bank is selected, and $BF60 is a write-only latch whose only record
# is the OS's CART_BANK_MIR - so every switch goes through API_CART_BANK ($FF03)
# and never through a direct store. Every OS entry point that touches the
# cartridge (cart_load, gpu_load_cart, rect_bg_cart, and the two-frame replay of
# the last) saves CART_BANK_MIR and restores it, so a borrow composes; the reader
# still re-selects its own bank once a frame rather than trusting that, because
# a future bank-aware VGM player is explicitly allowed to move it (cpu_os.s).
#
# The cost of the move is exactly one more `cart_load` in bootstrap.s: CODE2 and
# RODATA are no longer contiguous in the WINDOW, so they cannot be one copy any
# more. Nor are they contiguous in RAM any longer - see THE RODATA MOVE - and
# that costs nothing either: absolute addressing reaches the whole map, so a
# reference from CODE into RODATA resolves wherever the linker put it.
#
# Banking costs this cartridge NOTHING at run time, which is the whole reason it
# is the right answer to running out of room rather than shrinking the code.
# Model B already copies both segments out of the window into RAM before the
# first frame, and after that the window is never read again — see bootstrap.s.
# The two banks are two cart_load calls in the copy that was already happening.
#
# THE RODATA MOVE. RODATA is 1,666 bytes of PURE TABLES, and until now it spent
# them in the $2000-$5FFF window - the one resource in this machine that cannot
# be made bigger. Nothing put it there but history: it was contiguous with CODE
# because it started out as one copy, and the 6502 reaches the whole map with
# absolute addressing, so adjacency was never worth anything. It runs at $A000
# now, in the same full-speed upper RAM HIDATA already uses (both are the one
# CY7C199, no wait states either side), and the window got all 1,666 bytes back
# for CODE. That is the cheapest room this cartridge will ever be handed:
# bootstrap.s did not change one line - it takes every address from the linker's
# __RODATA_RUN__ - and tools/preview.py's whole 220-frame trace came back
# IDENTICAL, byte for byte, save for the cycle counters drifting by 13 as the
# tables' new page alignment changed which indexed reads cross a page.
#
# Model B: CODE and CODE2 are STORED in the window and RUN from RAM at $2000,
# because a read in the cartridge window costs 3 wait states and an instruction
# fetch is a read. bootstrap.s does the copy; define=yes is what gives it the
# __CODE_LOAD__ / __CODE_RUN__ / __RODATA_* symbols to do it with.
#
# THE BGDATA MOVE (2026-09-12). It was in bank 1 behind CODE2, and the SPIDER's
# code took CODE2 + BGDATA past 8 KB - the same squeeze that created bank 2 for
# RODATA, one bank along. BGDATA moved rather than CODE2 because BGDATA is the
# only segment in the cartridge whose bank number is a SYMBOL rather than a
# linker detail: it is read through the window, so `RING_BANK` names its bank,
# and the pair that has to agree is tools/bggen.py's BGDATA_BANK and this line.
# Nothing else in the image had to move an inch.
#
# It went to bank 4, behind COLD and CODE4, and NOT to bank 2 where RODATA had
# 5 KB spare: sharing an area with a segment that has a `run=` and following it
# in the SEGMENTS list makes ld65 fail with "Internal error: Invalid file offset
# for memory area ROM1". Bank 4's other tenants are read or copied the same way
# BGDATA is, and it took the move without complaint.
#
# BGDATA is the one exception: it stays in bank 2's window and is never copied
# anywhere. Nothing ever executes it or reads it through a RAM pointer - it is
# read directly off the cartridge by API_GPU_RECT_BG_CART, which bank-switches
# to it on demand (see radar.s's ring). A label in it is therefore already the
# address that call wants; no LOAD/RUN distinction to reason about.
#
# $1000 is chosen to clear the tables the game puts at $0400-$0FFF. It was
# $2000 for as long as the object pool sat at $1000-$1FFF; see the RAM line.
#
# fillval=$FF, not $EA: unprogrammed EPROM cells read as $FF, so an image padded
# with $FF matches what a real part looks like outside the used area.
# =============================================================================

# Banks are emitted to the output file in MEMORY-declaration order, so this
# order IS the bank order. fill=yes pads bank 0 to its full 8 KB, which is what
# makes bank 1 start at file offset $2000 and nothing else.
MEMORY {
    ROM0:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM1:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM2:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM3:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM4:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    # Banks 5-6: the screens. ART5 / ART6 are the intro's and title's pictures
    # as RLE bands (src/screens_art.s, tools/artgen.py), read straight out of
    # the window by API_GPU_RECT_BG_CART and never copied; UICODE, the screens'
    # code (src/screens.s), rides behind ART6 and runs in DEMO_RAM. BEFORE
    # MUSICBANK on purpose: that area is empty when MUSIC_ON = 0, so anything
    # declared after it would change bank number with a switch in music.s.
    ROM5:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM6:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    # Bank 7: SPRART - every sprite's art and the four GPU definition pages
    # (sprites.s), streamed to the GPU at power-on and never in CPU RAM - and
    # CODE7 behind it. It went here, its own bank, rather than into ROM2's
    # ~5.6 KB behind RODATA: a segment with no run= sharing a memory area with
    # one that HAS a run= (RODATA does) makes ld65 fail with "Internal error:
    # Invalid file offset for memory area ROM1" - see THE BGDATA MOVE below,
    # which hit the same wall. A whole bank costs nothing (256 KB / 32 banks
    # total), same as every other segment here that outgrew its neighbour.
    # BEFORE MUSICBANK, for the same reason ART5/ART6 are: declared after it,
    # its bank number would depend on MUSIC_ON.
    #
    # MSGDATA used to ride behind SPRART here and has moved to its own bank -
    # see THE MESSAGE BANK at ROM9.
    ROM7:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    # Bank 8: LEVELS - every level's opening state (levels.s, tools/level_editor.py)
    # and where its base stands (base.s BASE_*), read straight out of the window
    # by lv_open/lv_close (levels.s) and never copied. A sector reads it once, at
    # load, so the wait states cost nothing; it used to be resident in CODE6 and
    # would have grown with 15 sectors past the 391 bytes DEMO_RAM had left.
    # BEFORE MUSICBANK, for the reason ART5/ART6 and MSGDATA are: the song's banks
    # start after it, and MUSIC_BANK (music.s) is the one number that has to
    # follow. levels.s's LVL_BANK is the pair of this line.
    ROM8:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    # THE MESSAGE BANK. Bank 9: MSGDATA, every HUD label and indicator message
    # (hud_game.s, shield.s, emp.s, gate.s, pickup.s), and SPKDATA, the phonemes
    # for the ones that are SPOKEN (src/speech.s) - both read straight out of the
    # window like COLD / EXPL_OFF instead of sitting resident in RAM.
    #
    # IT IS A WHOLE BANK FOR THE MESSAGES AND NOTHING ELSE, and not because they
    # are big - 216 bytes of text and 142 of voice. It is because ONE BANK IS WHERE
    # THE POINTER MODEL STOPS BEING FLAT.
    # IND_LO/IND_HI (hud_game.s) are the two halves of a plain 16-bit pointer and
    # msg_open maps MSG_BANK as a constant; that works only while every message
    # is in the same bank. A second message bank would cost a third index table,
    # a bank byte at every reference, and a msg_open that takes an argument -
    # in five source files. So the limit is worth holding deliberately, and the
    # way to hold it is to stop sharing: behind SPRART the messages had 4.8 KB
    # and a neighbour that grows with every sprite. Here they have 8 KB and no
    # neighbour at all, which at the measured 13-byte average is ~600 of them.
    #
    # THE SPOKEN HALF IS HERE TOO, and this line used to say the opposite: it was
    # written before the voice existed and planned a bank of its own for it. What
    # the plan missed is that ONE BANK IS ONE BRACKET. spk_say copies the phoneme
    # string into the OS's own buffer at the moment of the call, so the string only
    # has to be readable for that one call - and ind_next (hud_game.s) already has
    # the window open on this bank, because it is reading the TEXT it is about to
    # speak. Sharing the bank costs no msg_open of its own, no second save byte and
    # no bank number that MUSIC_BANK has to follow; a separate bank would have cost
    # all three to keep 142 bytes apart from 216. SPKDATA is still its OWN SEGMENT,
    # so the generated file stays one standalone file - that part of the plan was
    # right, and tools/mkspeech.py writes it whole.
    #
    # SPK_LO/SPK_HI live in the bank as well, not in RODATA beside IND_LO/IND_HI:
    # upper RAM has 16 bytes left after CODE7 and the table is 28. In the bank it
    # is free, and ind_next reads it inside the bracket it already holds.
    #
    # BEFORE MUSICBANK, for the reason ART5/ART6, MSGDATA and LEVELS all are:
    # the song's banks start after it and MUSIC_BANK (music.s) follows.
    ROM9:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    # Banks 9-10: the VGM command stream, 25,732 bytes, bank-aligned at $8000 of
    # bank 5 and running contiguously. One MEMORY area rather than four ROMn
    # lines because the player's cursor crosses banks by itself - the stream is
    # one object and the linker should treat it as one.
    #
    # NO fill=, unlike every ROMn above, and that is the point: src/music.s pads
    # its own blob out to MUSIC_BANKS whole banks with $00 (a harmless byte for a
    # stream to overrun into; $FF is not a command the player knows). So the area
    # is exactly full when there is a song and exactly EMPTY when MUSIC_ON = 0 -
    # which makes the cartridge four banks smaller rather than four banks of
    # padding. A linker fill could not tell those two cases apart.
    MUSICBANK: start=$8000, size=$8000, type=ro, file=%O;
    # $1000, not $2000: the object pool used to fill $1000-$1FFF and it has
    # moved under the cartridge window (src/window.s), so those 4 KB are the
    # code window's now. That is the whole point of the move - it is the one
    # block of data RAM that sits DIRECTLY BELOW the run area, so vacating
    # it is the only way spare data RAM can ever turn into code space.
    RAM:   start=$1000, size=$5000, type=rw;
    # UPPER: MAD-65's "upper RAM", $A000-$BEFF (~7.75 KB) - real SRAM that is
    # FREE regardless of CART_EN (MAD-65 docs/MAD65_CPU_OS.md ~line 101-104),
    # separate from the $2000-$5FFF window CODE and CODE2 share, and touched by
    # nothing else in this cartridge. It now holds RODATA as well as HIDATA -
    # see THE RODATA MOVE - which is two cart_loads into the same area, landing
    # in SEGMENTS-declaration order: RODATA at $A000, HIDATA straight after it.
    UPPER: start=$A000, size=$1F00, type=rw;
    # DEMO_RAM, $C000-$DFFF - the CPU OS's demo half, the game's from
    # cart_init on (design_technical 11.19). Full speed, always mapped, and NOT
    # cleared on entry: whatever runs here is copied over the demo's image.
    #
    # $1F00 and not $2000: the top page, $DF00-$DFFF, is KEEP - RAM no segment
    # may be placed on, holding what must outlive a new game (the hiscore
    # table, src/hiscore.s DEMO_KEEP, which has to agree with this size).
    DEMO_RAM: start=$C000, size=$1F00, type=rw;
    # WINSHP: the top 2 KB of the RAM under the cartridge window, $9800-$9FFF -
    # not a linker-managed region until now (everything below it is hand-placed
    # state; see main.s SHAPES_AT). It holds every VERTEX TABLE in the game:
    # rocks, ship and enemies (shapes.s, enemies.s), copied in from bank 2 at
    # boot. Read only by passes that run inside cart_frame's win_off bracket,
    # where the window is RAM; never by the IRQ, never through a pointer the OS
    # dereferences. main.s asserts that this start and its SHAPES_AT agree.
    WINSHP: start=$9800, size=$0800, type=rw;
}

SEGMENTS {
    HEADER: load=ROM0,           type=ro, start=$8000;  # signature + vectors
    BOOT:   load=ROM0,           type=ro;               # runs in place, once
    CODE:   load=ROM0, run=RAM,  type=ro, define=yes;   # bank 0 -> RAM $2000
    CODE2:  load=ROM1, run=RAM,  type=ro, define=yes;   # bank 1 -> RAM, after it
    RODATA: load=ROM2, run=UPPER,type=ro, define=yes;   # bank 2 -> UPPER RAM,
                                                        #   NOT the $2000
                                                        #   window - see THE
                                                        #   RODATA MOVE below
    SHAPES: load=ROM2, run=WINSHP,type=ro, define=yes;  # ...and behind it in
                                                          #   bank 2: every vertex
                                                          #   table - rocks, ship,
                                                          #   enemies - run in the
                                                          #   RAM UNDER THE WINDOW
                                                          #   ($9800), not upper
                                                          #   RAM. Between RODATA
                                                          #   and HIDATA so bank 2
                                                          #   stays contiguous
    HIDATA: load=ROM3, run=UPPER,type=ro, define=yes;   # bank 3 -> RAM $A000,
                                                          #   its own separate
                                                          #   budget - see UPPER
    CODE3:  load=ROM3, run=RAM,  type=ro, define=yes;   # ...and the rest of
                                                          #   bank 3 -> RAM,
                                                          #   straight after
                                                          #   CODE2. The enemies
                                                          #   (foes.s) took bank
                                                          #   1 past 8 KB and
                                                          #   UPPER to its last
                                                          #   200 bytes; the RUN
                                                          #   area still had
                                                          #   3.8 KB, and bank
                                                          #   3 had 2.3 KB of
                                                          #   ROM behind HIDATA.
                                                          #   One more cart_load
                                                          #   in bootstrap.s
    COLD:   load=ROM4,           type=ro;               # NOT copied to RAM, and
                                                          #   not run from it
                                                          #   either: read
                                                          #   through the
                                                          #   $8000-$9FFF window
                                                          #   with bank 4
                                                          #   selected. A label
                                                          #   here IS its window
                                                          #   address - see the
                                                          #   BANK 4 note above.
    CODE4:  load=ROM4, run=RAM,  type=ro, define=yes;   # ...and behind it,
                                                          #   CODE4: the laser
                                                          #   (laser.s), copied
                                                          #   to the run area
                                                          #   straight after
                                                          #   CODE3 - the same
                                                          #   move CODE3 made,
                                                          #   one bank further
                                                          #   on. After COLD in
                                                          #   this list so COLD
                                                          #   keeps $8000
    BGDATA: load=ROM4,           type=ro;               # NOT copied to RAM -
                                                          #   read straight out
                                                          #   of the BANK 4
                                                          #   window by
                                                          #   API_GPU_RECT_BG_CART
                                                          #   (radar.s's ring).
                                                          #   Its bank is a
                                                          #   SYMBOL, RING_BANK,
                                                          #   generated into
                                                          #   src/radar_bg.s by
                                                          #   tools/bggen.py -
                                                          #   that constant and
                                                          #   this line are the
                                                          #   pair that has to
                                                          #   agree. Declared
                                                          #   HERE, beside the
                                                          #   other ROM2 tenant,
                                                          #   and not at the end
                                                          #   of this list: the
                                                          #   linker writes the
                                                          #   banks to the file
                                                          #   in the order the
                                                          #   segments claim
                                                          #   them, and a
                                                          #   segment that jumps
                                                          #   back to an earlier
                                                          #   bank is an "Invalid
                                                          #   file offset" error.
                                                          #   The bootstrap copy
                                                          #   is sized off
                                                          #   RODATA alone, so it
                                                          #   is still not pulled
                                                          #   into RAM
    CODE5:  load=ROM4, run=DEMO_RAM,type=ro, define=yes;  # ...and last in bank 4,
                                                          #   CODE5: the camera's
                                                          #   enemy framing
                                                          #   (cam.s), the first
                                                          #   tenant of
                                                          #   DEMO_RAM. The run
                                                          #   area had 850 bytes
                                                          #   and cam.s is twice
                                                          #   that. After BGDATA
                                                          #   so RING_BANK's
                                                          #   offsets stay put
    ART5:   load=ROM5,           type=ro;               # bank 5: pictures, read
                                                          #   in the window
    ART6:   load=ROM6,           type=ro;               # bank 6: the rest of them
    UICODE: load=ROM6, run=DEMO_RAM,type=ro, define=yes;  # ...and the screens'
                                                          #   code behind them,
                                                          #   run in DEMO_RAM
                                                          #   after CODE5
    CODE6:  load=ROM6, run=DEMO_RAM,type=ro, define=yes;  # ...and behind that,
                                                          #   CODE6: the pulsar
                                                          #   (pulsar.s), run in
                                                          #   DEMO_RAM after
                                                          #   UICODE. Bank 4 had
                                                          #   200 bytes left
    SPRART: load=ROM7,           type=ro, align=$100;   # bank 7, FIRST: the
                                                          #   sprites' art and
                                                          #   definition pages
                                                          #   (sprites.s), page
                                                          #   aligned, in the
                                                          #   order they land in
                                                          #   GPU RAM. NOT
                                                          #   copied to CPU RAM:
                                                          #   the OS streams it
                                                          #   from the window
                                                          #   into LOAD commands
                                                          #   (gpu_load_cart_
                                                          #   begin/_n)
    CODE7:  load=ROM7, run=UPPER,type=ro, define=yes;   # ...and behind it,
                                                          #   CODE7: the base's
                                                          #   keep-out (base.s),
                                                          #   stored in bank 7
                                                          #   and run in UPPER
                                                          #   RAM, after HIDATA
                                                          #   (1,796 bytes were
                                                          #   free there; the RUN
                                                          #   area had 35, bank 4
                                                          #   148 and DEMO_RAM
                                                          #   99)
    LEVELS: load=ROM8,           type=ro;               # bank 8: every level's
                                                          #   opening state and
                                                          #   base (levels.s,
                                                          #   base.s). NOT
                                                          #   copied anywhere -
                                                          #   read through the
                                                          #   window with bank 8
                                                          #   selected, once a
                                                          #   sector, by lv_open/
                                                          #   lv_close. A label
                                                          #   in it IS its window
                                                          #   address
    MSGDATA: load=ROM9,          type=ro;               # bank 9, with SPKDATA
                                                          #   HUD label and
                                                          #   indicator message
                                                          #   (hud_game.s,
                                                          #   shield.s, emp.s,
                                                          #   gate.s, pickup.s).
                                                          #   NOT copied anywhere
                                                          #   - read straight out
                                                          #   of the window, like
                                                          #   COLD, by msg_open/
                                                          #   msg_close
                                                          #   (hud_game.s).
                                                          #   Occasional only - a
                                                          #   row rebuild or a new
                                                          #   indicator, never a
                                                          #   per-frame walk - so
                                                          #   the window's wait
                                                          #   states cost nothing
                                                          #   measurable here. Its
                                                          #   own bank so the 16-
                                                          #   bit pointers in
                                                          #   IND_LO/IND_HI stay
                                                          #   flat - see THE
                                                          #   MESSAGE BANK above
    SPKDATA: load=ROM9,          type=ro;               # ...and its SPOKEN half:
                                                          #   the phoneme strings
                                                          #   and SPK_LO/SPK_HI
                                                          #   (src/speech.s,
                                                          #   generated by
                                                          #   tools/mkspeech.py),
                                                          #   read through the
                                                          #   SAME msg_open
                                                          #   bracket: spk_say
                                                          #   copies the string
                                                          #   into the OS's buffer
                                                          #   at the call, so one
                                                          #   open covers the text
                                                          #   AND the voice
    MUSICBLOB: load=MUSICBANK,   type=ro;               # banks 9-10: the VGM
                                                        #   command stream, read
                                                        #   out of the window by
                                                        #   the OS player a few
                                                        #   bytes a frame. Never
                                                        #   copied: no RAM at all
}
