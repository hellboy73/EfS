# =============================================================================
# Escape from Saturn — ld65 config: FOUR 8 KB banks, Model B
# =============================================================================
# The cartridge window is $8000-$9FFF, so one bank is 8 KB and the image is a
# whole number of them. The part is 256 KB — 32 banks — so a bank costs nothing
# and the map has grown one at a time as segments outgrew the one they were in:
#
#   bank 0   HEADER + BOOT + CODE      - the flight engine
#   bank 1   CODE2 + BGDATA            - the subsystems, and the ring bitmap
#   bank 2   RODATA                    - every table. Runs at $A000 too, since
#                                        THE RODATA MOVE below - not $2000
#   bank 3   HIDATA                    - runs at $A000, not $2000 - see below
#   bank 4   COLD                      - never copied anywhere - see below
#   banks 5-8 MUSICBLOB                - the VGM stream, read in the window
#
# CODE2 arrived with radar.s: the radar took CODE past 8 KB the moment the HUD
# was switched on, and the answer is the same one physics.s got - another bank,
# which is free.
#
# BANK 2 arrived with the SPLIT: rock_split's code and the four tables
# physics.md section 6 asks for took CODE2 + RODATA past 8 KB together. RODATA
# is what moved, and not BGDATA, for one reason - `RING_BANK` is emitted by
# tools/bggen.py into src/radar_bg.s, so moving the ring means the generator and
# the generated file have to move with it. RODATA has no such tie.
#
# BANK 3 (HIDATA) arrived with screen shake: CODE+CODE2+RODATA together ran
# past the 16 KB $2000-$5FFF window has (design_technical.md 11.18's "that
# number, not the bank map, is what a new table has to fit in"). A bank is
# still free, but ANOTHER one chained into that same $2000-$5FFF run would not
# have helped - the window itself was the scarce resource, not ROM. HIDATA
# instead runs at $A000, MAD-65's separate "upper RAM" ($A000-$BEFF, ~7.75 KB,
# free regardless of CART_EN - MAD-65 docs/MAD65_CPU_OS.md), which nothing else
# in this cartridge had ever touched. Same cart_load pattern, a fourth call in
# bootstrap.s, its own 7.75 KB budget entirely separate from the other three.
#
# BANK 4 (COLD) IS THE ONE THAT IS NEVER COPIED. Every segment above pays RAM
# for itself - that is what `run=` means - and the $2000-$5FFF window is the
# scarce thing in this cartridge (it stood at 50 free bytes). COLD is the other
# answer: data that is READ STRAIGHT OUT OF THE WINDOW, like BGDATA, so it costs
# no RAM at all and only the cartridge's three wait states on the reads that
# actually happen.
#
# WHAT BELONGS HERE. Anything read OCCASIONALLY, or a few isolated bytes at a
# time, rather than walked every frame in a hot per-object loop. The first
# tenant is EXPL_OFF (shots.s), the mini explosion's 3,072-byte animation - the
# single biggest object in the whole image, 65% of RODATA, and read at most 96
# times a frame from ONE loop. 96 reads x 3 wait states is ~290 cycles, 0.12% of
# a frame, against 18.8% of the RAM window handed back. Level scripts, message
# text and GUI tables are the natural next tenants; asteroid outlines and the
# collision tables are NOT - those are per-object and per-frame, and would pay
# the wait states thousands of times over.
#
# THE PRICE IS THE BANK REGISTER. A window read only returns the right byte if
# the right bank is selected, and $BF60 is a write-only latch whose only record
# is the OS's CART_SHADOW - so every switch goes through API_CART_BANK ($FF03)
# and never through a direct store. Every OS entry point that touches the
# cartridge (cart_load, gpu_load_cart, rect_bg_cart, and the two-frame replay of
# the last) saves CART_SHADOW and restores it, so a borrow composes; the reader
# still re-selects its own bank once a frame rather than trusting that, because
# a future bank-aware VGM player is explicitly allowed to move it (cpu_os.s).
#
# The cost of the move is exactly one more `cart_load` in bootstrap.s: CODE2 and
# RODATA are no longer contiguous in the WINDOW, so they cannot be one copy any
# more. Nor are they contiguous in RAM any longer - see THE RODATA MOVE - and
# that costs nothing either: absolute addressing reaches the whole map, so a
# reference from CODE into RODATA resolves wherever the linker put it.
#
# Banking costs this cartridge NOTHING at run time, which is the whole reason it
# is the right answer to running out of room rather than shrinking the code.
# Model B already copies both segments out of the window into RAM before the
# first frame, and after that the window is never read again — see bootstrap.s.
# The two banks are two cart_load calls in the copy that was already happening.
#
# THE RODATA MOVE. RODATA is 1,666 bytes of PURE TABLES, and until now it spent
# them in the $2000-$5FFF window - the one resource in this machine that cannot
# be made bigger. Nothing put it there but history: it was contiguous with CODE
# because it started out as one copy, and the 6502 reaches the whole map with
# absolute addressing, so adjacency was never worth anything. It runs at $A000
# now, in the same full-speed upper RAM HIDATA already uses (both are the one
# CY7C199, no wait states either side), and the window got all 1,666 bytes back
# for CODE. That is the cheapest room this cartridge will ever be handed:
# bootstrap.s did not change one line - it takes every address from the linker's
# __RODATA_RUN__ - and tools/preview.py's whole 220-frame trace came back
# IDENTICAL, byte for byte, save for the cycle counters drifting by 13 as the
# tables' new page alignment changed which indexed reads cross a page.
#
# Model B: CODE and CODE2 are STORED in the window and RUN from RAM at $2000,
# because a read in the cartridge window costs 3 wait states and an instruction
# fetch is a read. bootstrap.s does the copy; define=yes is what gives it the
# __CODE_LOAD__ / __CODE_RUN__ / __RODATA_* symbols to do it with.
#
# BGDATA is the one exception: it stays in bank 1's window and is never copied
# anywhere. Nothing ever executes it or reads it through a RAM pointer - it is
# read directly off the cartridge by API_GPU_RECT_BG_CART, which bank-switches
# to it on demand (see radar.s's ring). A label in it is therefore already the
# address that call wants; no LOAD/RUN distinction to reason about.
#
# $1000 is chosen to clear the tables the game puts at $0400-$0FFF. It was
# $2000 for as long as the object pool sat at $1000-$1FFF; see the RAM line.
#
# fillval=$FF, not $EA: unprogrammed EPROM cells read as $FF, so an image padded
# with $FF matches what a real part looks like outside the used area.
# =============================================================================

# Banks are emitted to the output file in MEMORY-declaration order, so this
# order IS the bank order. fill=yes pads bank 0 to its full 8 KB, which is what
# makes bank 1 start at file offset $2000 and nothing else.
MEMORY {
    ROM0:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM1:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM2:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM3:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    ROM4:  start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF, file=%O;
    # Banks 5-8: the VGM command stream, 25,732 bytes, bank-aligned at $8000 of
    # bank 5 and running contiguously. One MEMORY area rather than four ROMn
    # lines because the player's cursor crosses banks by itself - the stream is
    # one object and the linker should treat it as one.
    #
    # NO fill=, unlike every ROMn above, and that is the point: src/music.s pads
    # its own blob out to MUSIC_BANKS whole banks with $00 (a harmless byte for a
    # stream to overrun into; $FF is not a command the player knows). So the area
    # is exactly full when there is a song and exactly EMPTY when MUSIC_ON = 0 -
    # which makes the cartridge four banks smaller rather than four banks of
    # padding. A linker fill could not tell those two cases apart.
    MUSICBANK: start=$8000, size=$8000, type=ro, file=%O;
    # $1000, not $2000: the object pool used to fill $1000-$1FFF and it has
    # moved under the cartridge window (src/window.s), so those 4 KB are the
    # code window's now. That is the whole point of the move - it is the one
    # block of data RAM that sits DIRECTLY BELOW the run area, so vacating
    # it is the only way spare data RAM can ever turn into code space.
    RAM:   start=$1000, size=$5000, type=rw;
    # UPPER: MAD-65's "upper RAM", $A000-$BEFF (~7.75 KB) - real SRAM that is
    # FREE regardless of CART_EN (MAD-65 docs/MAD65_CPU_OS.md ~line 101-104),
    # separate from the $2000-$5FFF window CODE and CODE2 share, and touched by
    # nothing else in this cartridge. It now holds RODATA as well as HIDATA -
    # see THE RODATA MOVE - which is two cart_loads into the same area, landing
    # in SEGMENTS-declaration order: RODATA at $A000, HIDATA straight after it.
    UPPER: start=$A000, size=$1F00, type=rw;
}

SEGMENTS {
    HEADER: load=ROM0,           type=ro, start=$8000;  # signature + vectors
    BOOT:   load=ROM0,           type=ro;               # runs in place, once
    CODE:   load=ROM0, run=RAM,  type=ro, define=yes;   # bank 0 -> RAM $2000
    CODE2:  load=ROM1, run=RAM,  type=ro, define=yes;   # bank 1 -> RAM, after it
    RODATA: load=ROM2, run=UPPER,type=ro, define=yes;   # bank 2 -> UPPER RAM,
                                                        #   NOT the $2000
                                                        #   window - see THE
                                                        #   RODATA MOVE below
    HIDATA: load=ROM3, run=UPPER,type=ro, define=yes;   # bank 3 -> RAM $A000,
                                                          #   its own separate
                                                          #   budget - see UPPER
    CODE3:  load=ROM3, run=RAM,  type=ro, define=yes;   # ...and the rest of
                                                          #   bank 3 -> RAM,
                                                          #   straight after
                                                          #   CODE2. The enemies
                                                          #   (foes.s) took bank
                                                          #   1 past 8 KB and
                                                          #   UPPER to its last
                                                          #   200 bytes; the RUN
                                                          #   area still had
                                                          #   3.8 KB, and bank
                                                          #   3 had 2.3 KB of
                                                          #   ROM behind HIDATA.
                                                          #   One more cart_load
                                                          #   in bootstrap.s
    COLD:   load=ROM4,           type=ro;               # NOT copied to RAM, and
                                                          #   not run from it
                                                          #   either: read
                                                          #   through the
                                                          #   $8000-$9FFF window
                                                          #   with bank 4
                                                          #   selected. A label
                                                          #   here IS its window
                                                          #   address - see the
                                                          #   BANK 4 note above.
    MUSICBLOB: load=MUSICBANK,   type=ro;               # banks 5-8: the VGM
                                                        #   command stream, read
                                                        #   out of the window by
                                                        #   the OS player a few
                                                        #   bytes a frame. Never
                                                        #   copied: no RAM at all
    BGDATA: load=ROM1,           type=ro;               # NOT copied to RAM -
                                                          #   read straight out of
                                                          #   the bank 1 window by
                                                          #   API_GPU_RECT_BG_CART
                                                          #   (radar.s's ring).
                                                          #   It stays in BANK 1
                                                          #   because RING_BANK
                                                          #   is generated into
                                                          #   src/radar_bg.s by
                                                          #   tools/bggen.py, and
                                                          #   it now sits after
                                                          #   CODE2 rather than
                                                          #   after RODATA - the
                                                          #   bootstrap copy is
                                                          #   sized off CODE2
                                                          #   alone, so it is
                                                          #   still not pulled
                                                          #   into RAM
}
